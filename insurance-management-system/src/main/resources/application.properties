# ========================
# Application
# ========================
spring.application.name=insurance-management-system
server.port=8080

# ========================
# MySQL Database
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Jackson (JSON formatting)
# ========================
spring.jackson.serialization.indent-output=true

# ========================
# Groq AI Integration
# ========================
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}
groq.api.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}

# ========================
# Logging
# ========================
logging.level.com.rahul.insurance=DEBUG
logging.level.org.springframework.security=DEBUG
